name: release-mac

# macOS 桌面壳构建发布。
# 触发方式：
#   1. 打 tag（v*）→ 构建并发布 GitHub Release（壳更新走 L1）
#   2. 每周定时 + 手动触发 → 检测上游 @deepseek-ai/dsh 是否有新版；
#      有则仅递增 package.json 的 dshCore 元数据并发一个 patch tag，
#      便于分发渠道感知核心更新（用户端其实由 L2 热更新自动完成）。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1' # 每周一 02:00 UTC 检查上游核心版本

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14 # Apple Silicon  runner；如需 Intel 包可另加 macos-13
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建未签名安装包（zip + dmg）
        # 无 Apple Developer ID：identity 已在 package.json 置 null，
        # electron-builder 跳过签名。日后配置 CSC_LINK / CSC_KEY_PASSWORD
        # secrets 即可无缝切换为签名+公证构建。
        run: npx electron-builder --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
