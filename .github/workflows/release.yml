# 发布链路：打 `v*` tag 推送 → 双平台矩阵构建 → 自动发布到 GitHub Release。
# Release 即对外下载入口（README「安装」一节的链接指向 releases 页面）；
# 壳内 L1 更新检查（electron/app-updater.mjs）读取的也是 releases/latest。
#
# 手动触发（workflow_dispatch）只构建不发布，产物上传为 workflow artifact，
# 用于发版前的打包冒烟验证。
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # electron-builder 发布 Release 需要

jobs:
  # 先单独创建 Release：两个平台的 electron-builder 并行“查询或创建”
  # 不是原子操作，不加这一步会各自建出同名 Release，资产被拆到两处。
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create release for tag
        run: gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 ||
             gh release create "$TAG" --repo "$REPO" --verify-tag --title "$TAG"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac --arm64 --x64
          - os: windows-latest
            args: --win --x64 --arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # tag 构建：构建并发布（package.json build.publish 已指向
      # rye567/dsh-desktop，releaseType=release 发布后立即可下载）。
      - name: Build & publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: npx electron-builder ${{ matrix.args }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 手动触发：只构建，产物留作 artifact 供下载验证。
      - name: Build only
        if: github.event_name == 'workflow_dispatch'
        run: npx electron-builder ${{ matrix.args }} --publish never

      - name: Upload artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: release/
          if-no-files-found: error
